name: Deploy TechPulse to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "techpulse-intelligence/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: techpulse-intelligence/web/package-lock.json
      - name: Install dependencies
        run: npm --prefix techpulse-intelligence/web ci
      - name: Build with Next.js (Static Export)
        env:
          GITHUB_ACTIONS: "true"
        run: npm --prefix techpulse-intelligence/web run build
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./techpulse-intelligence/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
